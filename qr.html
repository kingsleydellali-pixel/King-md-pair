<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Pairing — KING XD V6</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #0a0a0f; color: #e0e0e0; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
    .card { background: linear-gradient(145deg, #12121a, #1a1a2e); padding: 50px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.8); border: 1px solid #2a2a4a; text-align: center; max-width: 450px; }
    h2 { background: linear-gradient(90deg, #8b5cf6, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
    p { color: #8888aa; font-size: 13px; margin-bottom: 25px; }
    button { padding: 15px 40px; border-radius: 10px; border: none; background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: white; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; }
    button:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(139,92,246,0.4); }
    #qrBox { margin-top: 25px; display: none; }
    #qrBox img { width: 250px; height: 250px; border-radius: 12px; }
    a.back { display: inline-block; margin-top: 20px; color: #8b5cf6; text-decoration: none; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🔲 QR Pairing</h2>
    <p>Scan the QR code with WhatsApp to link</p>
    <button onclick="generate()">Generate QR</button>
    <div id="qrBox">
      <img id="qrImg" alt="QR Code" />
      <p style="margin-top:15px; color:#22c55e;">Scan with WhatsApp → Linked Devices</p>
    </div>
    <a href="/" class="back">← Back to Home</a>
  </div>

  <script>
    async function generate() {
      document.querySelector('button').innerText = 'Loading...';
      try {
        const res = await fetch('/qr/generate');
        const data = await res.json();
        if (data.success) {
          document.getElementById('qrImg').src = data.qr;
          document.getElementById('qrBox').style.display = 'block';
        } else {
          alert('Error: ' + data.error);
        }
      } catch (e) { alert('Failed: ' + e.message); }
      document.querySelector('button').innerText = 'Generate QR';
    }
  </script>
</body>
</html>
