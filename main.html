<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>👑 KING XD V6 PAIRING</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      text-align: center;
      padding: 60px 40px;
      max-width: 600px;
    }
    h1 {
      font-size: 42px;
      background: linear-gradient(90deg, #8b5cf6, #06b6d4, #22c55e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }
    .subtitle {
      color: #8888aa;
      font-size: 14px;
      margin-bottom: 40px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .buttons { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
    a.btn {
      padding: 16px 40px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.3s;
      border: 1px solid #2a2a4a;
    }
    .btn-pair { background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: white; }
    .btn-qr { background: transparent; color: #8b5cf6; }
    a.btn:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(139, 92, 246, 0.4); }
    .footer {
      margin-top: 50px;
      font-size: 12px;
      color: #555577;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>👑 KING XD V6</h1>
    <p class="subtitle">Pairing System</p>
    <p style="color:#aaa; margin-bottom:30px;">Link any Baileys WhatsApp bot instantly</p>
    <div class="buttons">
      <a href="/pair.html" class="btn btn-pair">📱 Pair with Code</a>
      <a href="/qr.html" class="btn btn-qr">🔲 Pair with QR</a>
    </div>
    <div class="footer">
      Developed by KINGSLEY-XMD TECH<br/>
      © 2026 All Rights Reserved
    </div>
  </div>
</body>
  </html>
